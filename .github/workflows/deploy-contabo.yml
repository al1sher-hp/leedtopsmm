name: Deploy to Contabo

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-contabo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy leedtopsmm via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          port: ${{ secrets.CONTABO_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.CONTABO_PROJECT_PATH }}"

            git fetch origin main
            git reset --hard origin/main

            docker compose build
            docker compose up -d

            docker compose ps
